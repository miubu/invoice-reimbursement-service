<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理后台 · 报销工作台</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=5.0.0">
  <link rel="stylesheet" href="/assets/site-image.css?v=5.0.0">
  <link rel="stylesheet" href="/assets/admin.css?v=5.0.0">
</head>
<body class="admin-body">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">管</span>
      <strong>报销工作台管理后台</strong>
    </a>
    <div class="header-actions"><a href="/">报销首页</a><button id="logout-button" class="text-button subtle" type="button" hidden>退出</button></div>
  </header>

  <main class="admin-shell">
    <section id="login-panel" class="panel login-panel">
      <h1>登录管理后台</h1>
      <p>登录后可发布各页面的报销注意事项，管理报销规则和界面内容。</p>
      <form id="login-form" class="login-form">
        <label class="field"><span>账号</span><input id="admin-username" value="admin" autocomplete="username" required></label>
        <label class="field"><span>密码</span><input id="admin-password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit"><span>登录</span></button>
      </form>
      <p id="login-error" class="admin-error" role="alert"></p>
    </section>

    <div id="admin-console" hidden>
      <div class="admin-heading">
        <h1>服务内容管理</h1>
        <nav aria-label="后台设置导航"><a href="#notices">报销注意事项</a><a href="#images">界面图片</a><a href="#rules">报销规则</a><a href="#texts">界面文案</a></nav>
      </div>

      <section id="notices" class="panel" aria-labelledby="notices-heading">
        <div class="section-heading"><h2 id="notices-heading">报销注意事项</h2></div>
        <label class="field notice-page-choice"><span>显示页面</span>
          <select id="notice-page">
            <option value="home">报销首页</option>
            <option value="invoice">日常报销</option>
            <option value="travel">差旅报销</option>
          </select>
        </label>
        <div id="notice-editors"></div>
      </section>

      <section id="images" class="panel">
        <div class="section-heading"><h2>界面图片</h2><span class="muted">PNG / JPEG / WebP · 单张最多 5 MB</span></div>
        <div id="image-manager" class="image-manager"></div>
      </section>

      <section id="rules" class="panel">
        <div class="section-heading"><h2>报销识别规则</h2><span class="muted">项目名称包含任一关键词即命中</span></div>
        <div class="rule-toolbar"><span>只有“关键词”参与发票匹配，规则名称仅作管理员标签。</span><button id="new-rule" class="button primary" type="button"><span>＋ 新建规则</span></button></div>
        <div id="rule-list" class="rule-list"></div>
        <div class="admin-actions"><button id="save-rules" class="button primary" type="button"><span>保存全部规则</span></button></div>
      </section>

      <section id="texts" class="panel">
        <div class="section-heading"><h2>界面文案</h2><span class="muted">修改日常报销页面显示的文字</span></div>
        <div id="site-text-fields" class="site-text-grid"></div>
        <div class="admin-actions"><button id="save-site-texts" class="button primary" type="button"><span>保存界面文案</span></button></div>
      </section>

    </div>
  </main>
  <template id="notice-editor-template">
    <form class="notice-editor">
      <div class="notice-fields">
        <label class="field"><span>标题</span><input name="title" maxlength="80" required></label>
        <label class="field"><span>正文</span><textarea name="body" rows="6" maxlength="6000" required></textarea><small>可换行，段落间可留空行。</small></label>
      </div>
      <aside class="notice-sample" aria-label="注意事项内容预览">
        <span>内容预览</span><h3></h3><p></p>
      </aside>
      <div class="notice-footer"><span role="status"></span>
        <button type="submit" class="button primary">发布注意事项</button>
      </div>
    </form>
  </template>
  <template id="image-editor-template">
    <fieldset class="image-card">
      <legend class="image-heading"></legend>
      <div class="image-stage">
        <div class="image-frame"><span>使用默认外观</span></div>
      </div>
      <div class="image-source">
        <input class="image-file" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" hidden>
        <button type="button" class="text-button image-choose">选择图片</button>
        <button type="button" class="text-button subtle image-remove">移除图片</button>
      </div>
      <fieldset class="image-adjust">
        <legend>取景</legend>
        <p class="image-hint">拖动预览图可移动位置，也可用滑块微调。</p>
        <label class="image-fit">显示方式<select><option value="contain">完整显示</option><option value="cover">铺满画框</option></select></label>
        <label class="image-range">缩放<input type="range" data-key="zoom" min="100" max="250"><output></output></label>
        <label class="image-range">水平位置<input type="range" data-key="x" min="0" max="100"><output></output></label>
        <label class="image-range">垂直位置<input type="range" data-key="y" min="0" max="100"><output></output></label>
        <button type="button" class="image-reset">恢复默认取景</button>
      </fieldset>
      <p class="image-status" role="status"></p>
      <div class="image-actions">
        <button type="button" class="text-button subtle image-cancel">撤销修改</button>
        <button type="button" class="button primary image-save">保存图片设置</button>
      </div>
    </fieldset>
  </template>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/site-image.js?v=5.0.0" defer></script>
  <script src="/assets/admin.js?v=5.0.0" defer></script>
</body>
</html>
